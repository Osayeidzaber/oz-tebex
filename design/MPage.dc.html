<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone FAQ</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1020}
.s{--a:#D4FF3A;--b:#B9A6FF;font-family:Inter,sans-serif;color:#E9EEF7;font-size:14px}
.h{font-family:"Pixelify Sans",sans-serif}
.m{color:#A3ADC2}
.k{font:600 11px/1.2 "Pixelify Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#A3ADC2}
.pan{background:#151B30;border:3px solid #05070F;box-shadow:inset 0 0 0 2px #232B47,inset 0 -6px 0 rgba(0,0,0,.25)}
.slot{background:#0E1324;box-shadow:inset 4px 4px 0 rgba(0,0,0,.55),inset -4px -4px 0 rgba(255,255,255,.07);display:grid;place-items:center;position:relative}
.qi{border:3px solid #05070F;background:#0E1324}
.qi.open{background:#1B2340;box-shadow:inset 4px 0 0 var(--a)}
.q{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px;border:0;background:transparent;color:#E9EEF7;font:600 16px "Pixelify Sans",sans-serif;text-align:left}
.pm{width:26px;height:26px;border:3px solid #05070F;background:#2A3456;display:grid;place-items:center;flex:none}
.open .pm{background:var(--a);color:#05070F}
</style>
</helmet>
<div class="s" style="width: 390px; height: 1200px; overflow: hidden; background: #0B1020">
  <header style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #050816; border-bottom: 6px solid #EEF4FF">
    <button class="h" style="width: 44px; height: 44px; border: 3px solid #05070F; background: #2A3456; color: #fff" aria-label="Menu">≡</button>
    <span class="h" style="font-size: 26px; font-weight: 700; text-shadow: 0 3px 0 var(--a), 0 6px 0 #05070F">Frostvale</span>
    <button class="h" style="width: 44px; height: 44px; border: 3px solid #05070F; background: var(--a); color: #05070F" aria-label="Basket, 0 items">0</button>
  </header>
  <div style="padding: 18px 12px; display: flex; flex-direction: column; gap: 8px">
    <div class="m" style="font-size: 12px">Home / FAQ</div>
    <h1 class="h" style="margin: 0 0 8px; font-size: 40px; color: var(--a)">Questions?</h1>
    <div class="qi open"><button class="q" aria-expanded="true">How long until I get my items?<span class="pm">−</span></button><p class="m" style="margin: 0; padding: 0 14px 14px; line-height: 1.6">Usually under 2 minutes. Be online in-game. Still nothing after 15 minutes? Open a Discord ticket.</p></div>
    <div class="qi"><button class="q" aria-expanded="false">Can I buy for a friend?<span class="pm">+</span></button></div>
    <div class="qi"><button class="q" aria-expanded="false">Do ranks give PvP advantage?<span class="pm">+</span></button></div>
    <div class="qi"><button class="q" aria-expanded="false">How does upgrading work?<span class="pm">+</span></button></div>
    <div class="qi"><button class="q" aria-expanded="false">Does it work on Bedrock?<span class="pm">+</span></button></div>
  </div>
  <section class="pan" style="margin: 0 12px; padding: 16px">
    <div class="k" style="color: var(--b)">Hall of fame</div>
    <h2 class="h" style="margin: 4px 0 12px; font-size: 26px">Supporters</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="text-align: center"><span class="slot" style="height: 80px"><svg width="44" height="44" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#2B2B2B" d="M0 0h8v8H0z"></path><path fill="#D9A77D" d="M0 3h8v5H0z"></path><path fill="#6A4FD8" d="M2 4h1v1H2zM5 4h1v1H5z"></path></svg></span><div class="h" style="font-size: 13px; margin-top: 4px">Luxen2017</div></div>
      <div style="text-align: center"><span class="slot" style="height: 80px"><svg width="44" height="44" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#7A2E1E" d="M0 0h8v8H0z"></path><path fill="#D9A27A" d="M0 3h8v5H0z"></path><path fill="#222" d="M2 4h1v1H2zM5 4h1v1H5z"></path></svg></span><div class="h" style="font-size: 13px; margin-top: 4px">Fratage</div></div>
      <div style="text-align: center"><span class="slot" style="height: 80px"><svg width="44" height="44" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#E8E2D0" d="M0 0h8v8H0z"></path><path fill="#F0C9A8" d="M0 3h8v5H0z"></path><path fill="#3B82F6" d="M2 4h1v1H2zM5 4h1v1H5z"></path></svg></span><div class="h" style="font-size: 13px; margin-top: 4px">willo_mc</div></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
