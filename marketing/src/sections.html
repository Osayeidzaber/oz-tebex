<!doctype html>
<!--
  Section-by-section marketing images built from the theme's REAL components.
  Served from .preview (same origin as the rendered pages): /sections.html?s=<id>
  Each section fetches rendered theme pages, clones the named components and lays them out
  with the theme's own oz.css. Render with marketing/render-sections.sh.
-->
<html lang="en" data-preset="frost" data-mode="dark" data-mode-choice="dark" data-corners="square" data-panels="bevel" data-font="pixel" data-header="scene" data-reveal="none" data-icons="hover">
<head>
<meta charset="utf-8">
<title>OZ sections</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="oz.css">
<link rel="stylesheet" href="oz-icons.css">
<style>
  :root { --mk-lime: #D4FF3A; --mk-violet: #B9A6FF; --mk-ink: #11160A; }
  html, body { margin: 0; background: #0A0F1E; }
  body { width: 2000px; height: 1386px; overflow: hidden; position: relative; font-family: "Inter", sans-serif; }
  .mk-bg { position: absolute; inset: 0; background:
    radial-gradient(900px 600px at 10% 20%, rgba(212,255,58,.08), transparent 60%),
    radial-gradient(1000px 700px at 100% 100%, rgba(185,166,255,.14), transparent 60%),
    linear-gradient(180deg, #0E1532, #0A0F1E 60%); }
  .mk-band { position: absolute; left: 0; right: 0; top: 0; height: 200px; background: var(--mk-lime); color: var(--mk-ink);
    display: flex; align-items: center; padding: 0 80px; font: 700 96px "Pixelify Sans", sans-serif; letter-spacing: 1px;
    box-shadow: inset 0 -12px 0 rgba(0,0,0,.18); overflow: hidden; }
  .mk-band::after { content: ""; position: absolute; right: 60px; top: 30px; width: 240px; height: 240px; opacity: .12;
    background: repeating-linear-gradient(90deg, #11160A 0 24px, transparent 24px 48px), repeating-linear-gradient(0deg, #11160A 0 24px, transparent 24px 48px); }
  .mk-band .arr { margin-left: 26px; }
  .mk-band .tag { font-family: "Inter", sans-serif !important; font-weight: 800; letter-spacing: 0; margin-left: auto; position: relative; z-index: 1; padding: 12px 22px; background: var(--mk-violet); color: #15102B; font-size: 34px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.2); }
  .mk-head { position: absolute; left: 80px; right: 80px; top: 250px; }
  .mk-head.right { text-align: right; }
  .mk-head h1 { margin: 0; font: 700 64px "Pixelify Sans", sans-serif; color: #fff; letter-spacing: .5px; }
  .mk-head p { margin: 18px 0 0; font: 500 30px/1.5 "Inter", sans-serif; color: #B9C3E3; letter-spacing: 4px; max-width: 1300px; }
  .mk-head.right p { margin-left: auto; }
  .mk-stage { position: absolute; left: 70px; right: 70px; bottom: 60px; display: grid; gap: 22px; align-items: start; }
  .mk-frame { padding: 18px; border: 3px solid #2B3766; background: rgba(10,15,34,.75); box-shadow: 0 30px 70px rgba(0,0,0,.45); overflow: hidden; }
  .mk-z { transform-origin: top left; }
  .mk-col { display: grid; gap: 18px; align-content: start; }
  .mk-shot { width: 100%; display: block; }
  .mk-note { margin-top: 12px; font: 600 20px "Inter"; color: #9AA6C7; }
  /* neutralise behaviour-only theme styles on cloned parts */
  .mk-frame .oz-drawer { position: static !important; transform: none !important; inset: auto !important; width: auto !important; height: auto !important; max-height: none !important; visibility: visible !important; opacity: 1 !important; box-shadow: none !important; }
  .mk-frame .oz-modal { position: static !important; display: block !important; background: none !important; opacity: 1 !important; visibility: visible !important; inset: auto !important; }
  .mk-frame .oz-modal__box { transform: none !important; margin: 0 !important; }
  .mk-frame [hidden] { display: none !important; }
  .mk-frame * { animation: none !important; }
</style>
</head>
<body>
<div class="mk-bg"></div>
<div class="mk-band"><span id="band"></span><span class="arr">›</span><span class="tag" id="tag" hidden></span></div>
<div class="mk-head" id="head"><h1 id="title"></h1><p id="sub"></p></div>
<div class="mk-stage" id="stage"></div>

<script>
/* Each part: page = rendered preview page, sel = CSS selector, n = how many matches, zoom = scale,
   or img = a screenshot file (only for the live 3D canvas, which can't be cloned). */
var S = {
  product: { band: 'Product & Basket', title: 'Package cards, quick add and a slide-out basket',
    sub: 'Clean pixel cards with quantity buttons, badges and sale prices. The basket slides in so players keep shopping.',
    cols: '1.75fr 1fr', parts: [
      [{ page: 'category-grid.html', sel: '.oz-packages', zoom: 0.98, style: '--per-row:3' }],
      [{ page: 'category-grid.html', sel: '#oz-basket', zoom: 1.05 }]
    ] },
  sidebar: { band: 'Sidebar Modules', title: 'All 8 Tebex sidebar modules, restyled',
    sub: 'Server goal, community goal, top supporter, recent payments, featured package, server status, gift card balance and text box.',
    cols: '1fr 1fr 1fr', parts: [
      [{ page: 'index.html', sel: '.oz-sidebar > .oz-mod', pick: [0, 1], zoom: 1.25 }],
      [{ page: 'index.html', sel: '.oz-sidebar > .oz-mod', pick: [2, 3], zoom: 1.25 }],
      [{ page: 'index.html', sel: '.oz-sidebar > .oz-mod', pick: [4, 5, 6], zoom: 1.25 }]
    ] },
  login: { band: 'Java & Bedrock Login', title: 'The right username, every time',
    sub: 'Players pick their edition and see their own skin before paying. Bedrock names get your Geyser/Floodgate prefix automatically.',
    right: true, cols: '1fr 1.1fr', parts: [
      [{ page: 'login.html', sel: '.oz-login, .oz-content > .oz-panel', n: 1, zoom: 1.3 }],
      [{ page: 'index.html', sel: '.oz-mod.oz-player', n: 1, zoom: 1.55 }]
    ] },
  quantity: { band: 'Quantity Selector', title: 'Sell keys, coins and crates in bulk',
    sub: 'Pick which categories get ×1 ×5 ×10 ×15 buttons. The button shows the total before it goes in the basket.',
    cols: '1fr', parts: [
      [{ page: 'category-grid.html', sel: '.oz-pkg', n: 3, zoom: 1.25, style: 'grid-template-columns:repeat(3,1fr)', clickQty: '10' }]
    ] },
  setup: { band: 'Setup Page', title: 'A checklist that writes your settings',
    sub: 'See what is missing, then use the editors to build staff lists, vote sites, FAQ, slider and rank tables. Copy, paste, done.',
    cols: '1fr', parts: [
      [{ page: 'page-setup.html', sel: '.oz-setup__groups', zoom: 1.22 }]
    ] },
  ranks: { band: 'Rank Preview', tag: 'Add-on · $5', title: 'Try the rank on before you buy it',
    sub: 'A live 3D skin with the rank nametag, a chat and tab-list preview, a rank ladder and a full comparison table.',
    cols: '0.9fr 1.6fr', parts: [
      [{ img: 'shots/ranks-viewer.png' }],
      [{ page: 'category-ranks.html', sel: '.oz-ranks', zoom: 0.95 }]
    ] },
  sales: { band: 'Sales Pack', tag: 'Add-on · $5', title: 'Urgency and a welcome deal',
    sub: 'A homepage sale bar with a live countdown, a one-time discount pop-up with click-to-copy code, and a currency picker.',
    right: true, cols: '1.5fr 1fr', parts: [
      [{ page: 'home-extras.html', sel: '.oz-sale', zoom: 1.12, countdown: true }, { page: 'home-extras.html', sel: '#oz-basket .oz-drawer__head', zoom: 1.5 }],
      [{ page: 'home-extras.html', sel: '.oz-promo__box', zoom: 1.45 }]
    ] },
  pages: { band: 'Pages Pack', tag: 'Add-on · $5', title: 'Six community pages, filled from settings',
    sub: 'Staff, Vote, FAQ, Patrons, Rules and News. Create a Tebex page with that title and OZ lays it out.',
    cols: '1.2fr 1fr', parts: [
      [{ page: 'page-staff.html', sel: '.oz-people', zoom: 1.1 }, { page: 'page-faq.html', sel: '.oz-faq', zoom: 1.1 }],
      [{ page: 'page-vote.html', sel: '.oz-votes', zoom: 1.15 }, { page: 'page-rules.html', sel: '.oz-rules', zoom: 1.0, maxH: 360 }]
    ] }
};

var id = new URLSearchParams(location.search).get('s') || 'product';
var cfg = S[id];
document.getElementById('band').textContent = cfg.band;
if (cfg.tag) { var t = document.getElementById('tag'); t.textContent = cfg.tag; t.hidden = false; }
document.getElementById('title').textContent = cfg.title;
document.getElementById('sub').textContent = cfg.sub;
if (cfg.right) document.getElementById('head').classList.add('right');
var stage = document.getElementById('stage');
stage.style.gridTemplateColumns = cfg.cols;
stage.style.top = '520px';

var cache = {};
function load(page) {
  if (!cache[page]) cache[page] = fetch(page).then(function (r) { return r.text(); }).then(function (h) { return new DOMParser().parseFromString(h, 'text/html'); });
  return cache[page];
}

Promise.all(cfg.parts.map(function (col) {
  var colEl = document.createElement('div'); colEl.className = 'mk-col'; stage.appendChild(colEl);
  return Promise.all(col.map(function (p) {
    var frame = document.createElement('div'); frame.className = 'mk-frame'; colEl.appendChild(frame);
    if (p.img) { var im = new Image(); im.className = 'mk-shot'; im.src = p.img; frame.appendChild(im); return; }
    return load(p.page).then(function (doc) {
      var all = Array.prototype.slice.call(doc.querySelectorAll(p.sel));
      var list = p.pick ? p.pick.map(function (i) { return all[i]; }).filter(Boolean) : all.slice(0, p.n || 1);
      var inner = document.createElement('div'); inner.className = 'mk-z mk-col';
      if (p.style) inner.setAttribute('style', p.style);
      list.forEach(function (el) { inner.appendChild(document.importNode(el, true)); });
      frame.appendChild(inner);
      if (p.countdown) [["d","06"],["h","22"],["m","58"],["s","40"]].forEach(function (u) { var b = inner.querySelector('[data-oz-cd="' + u[0] + '"]'); if (b) b.textContent = u[1]; });
      if (p.clickQty) inner.querySelectorAll('[data-oz-qty="' + p.clickQty + '"]').forEach(function (b) {
        b.parentNode.querySelectorAll('[data-oz-qty]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      });
      // scale to fit the frame width
      requestAnimationFrame(function () {
        var z = p.zoom || 1, w = frame.clientWidth - 36;
        inner.style.width = (w / z) + 'px';
        inner.style.transform = 'scale(' + z + ')';
        var h = inner.scrollHeight * z;
        frame.style.height = Math.min(h + 36, p.maxH || 99999) + 'px';
      });
    });
  }));
})).then(function () { document.documentElement.setAttribute('data-ready', '1'); });
</script>
</body>
</html>
