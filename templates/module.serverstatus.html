<div class="oz-panel oz-mod">
  <h3>{{ module.header|default(__('Server status')) }}</h3>
  <div class="oz-status">
    <span class="oz-status__dot {% if not module.online %}is-off{% endif %}" aria-hidden="true"></span>
    <strong style="font-family:var(--font-pixel);font-size:18px">{% if module.online %}{{ module.players.online }} / {{ module.players.max }} {{ __('online') }}{% else %}{{ __('Offline') }}{% endif %}</strong>
  </div>
  <button class="oz-btn oz-btn--alt oz-btn--block oz-btn--sm" type="button" data-oz-copy="{{ module.ip }}{% if module.port and module.port != 25565 %}:{{ module.port }}{% endif %}" style="margin-top:12px">{{ module.ip }}{% if module.port and module.port != 25565 %}:{{ module.port }}{% endif %}</button>
</div>
